<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="eyebrow">Report Card System</div>
    <h1>Canaan Progressive Schools</h1>

    <div id="alertBox"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="primary" id="submitBtn">Sign in</button>
    </form>
  </div>
</div>

<div class="footer-credit">Designed by Muhima Timothy · 0770707899 / 0778268503 · muhimatim51@gmail.com</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const alertBox = document.getElementById("alertBox");
  const submitBtn = document.getElementById("submitBtn");

  function showError(message) {
    alertBox.innerHTML = `<div class="alert error">${message}</div>`;
  }

  // If already signed in, skip straight to the right dashboard.
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const profile = await fetchOwnProfile();
      if (profile) {
        window.location.href =
          profile.role === "admin" ? "admin/dashboard.html" : "teacher/dashboard.html";
      }
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { profile, error } = await login(email, password);

    if (error) {
      showError(error);
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
      return;
    }

    window.location.href =
      profile.role === "admin" ? "admin/dashboard.html" : "teacher/dashboard.html";
  });
</script>

</body>
</html>
