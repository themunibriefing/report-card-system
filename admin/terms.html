<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Terms — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Canaan Progressive<br />Schools</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="classes.html">Classes</a>
      <a href="subjects.html">Subjects</a>
      <a href="terms.html" class="active">Terms</a>
      <a href="assignments.html">Assignments</a>
      <a href="marks.html">Marks</a>
      <a href="results.html">Results</a>
      <a href="reports.html">Report Cards</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Academic Years &amp; Terms</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <div id="alertBox"></div>

    <div class="toolbar">
      <div class="spacer"></div>
      <button class="secondary" id="addYearBtn">+ Add Academic Year</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Academic Year</th><th>Current</th><th>Terms</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="page-loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add academic year -->
<dialog class="modal" id="yearDialog">
  <div class="modal-body">
    <h2>Add Academic Year</h2>
    <div id="yearAlert"></div>
    <form id="yearForm">
      <div class="field">
        <label for="yearInput">Year</label>
        <input type="text" id="yearInput" placeholder="e.g. 2026" required />
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelYearBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Manage terms for a year -->
<dialog class="modal" id="termsDialog">
  <div class="modal-body">
    <h2 id="termsTitle">Terms</h2>
    <div id="termsAlert"></div>
    <div class="table-wrap" style="margin-bottom: 16px;">
      <table class="data-table">
        <thead><tr><th>Term</th><th>Current</th><th></th></tr></thead>
        <tbody id="termsBody"></tbody>
      </table>
    </div>
    <form id="termForm">
      <div class="field-row">
        <div class="field" style="margin-bottom:0;">
          <input type="text" id="termName" placeholder="e.g. Term I" required />
        </div>
        <button type="submit" class="secondary">+ Add</button>
      </div>
    </form>
    <div class="modal-actions">
      <button type="button" class="primary" id="closeTermsBtn">Done</button>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/terms.js"></script>

</body>
</html>
