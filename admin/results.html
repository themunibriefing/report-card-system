<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Results — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Canaan Progressive<br />Schools</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="classes.html">Classes</a>
      <a href="subjects.html">Subjects</a>
      <a href="terms.html">Terms</a>
      <a href="assignments.html">Assignments</a>
      <a href="marks.html">Marks</a>
      <a href="results.html" class="active">Results</a>
      <a href="reports.html">Report Cards</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Results</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <div id="alertBox"></div>

    <div class="toolbar">
      <select id="yearSelect"></select>
      <select id="termSelect"></select>
      <select id="classFilter"><option value="">All classes</option></select>
      <select id="streamFilter"><option value="">All streams</option></select>
      <select id="subjectFilter"><option value="">All subjects</option></select>
    </div>
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by student name…" />
      <div class="spacer"></div>
      <span id="resultCount" style="font-size:0.85rem;color:var(--ink-soft);"></span>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Student</th><th>Class</th><th>Subject</th><th>AI</th><th>Exam</th><th>Total</th><th>Grade</th></tr>
        </thead>
        <tbody id="resultsBody">
          <tr><td colspan="7" class="page-loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/admin-results.js"></script>

</body>
</html>
