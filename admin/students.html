<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Students — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Canaan Progressive<br />Schools</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="students.html" class="active">Students</a>
      <a href="teachers.html">Teachers</a>
      <a href="classes.html">Classes</a>
      <a href="subjects.html">Subjects</a>
      <a href="terms.html">Terms</a>
      <a href="assignments.html">Assignments</a>
      <a href="marks.html">Marks</a>
      <a href="results.html">Results</a>
      <a href="reports.html">Report Cards</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Students</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <div id="alertBox"></div>

    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name…" />
      <select id="classFilter"><option value="">All classes</option></select>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <div class="spacer"></div>
      <button class="secondary" id="addBtn">+ Add Student</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Full Name</th><th>Gender</th><th>Date of Birth</th><th>Class</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="page-loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<dialog class="modal" id="formDialog">
  <div class="modal-body">
    <h2 id="formTitle">Add Student</h2>
    <div id="formAlert"></div>
    <form id="studentForm">
      <input type="hidden" id="studentId" />
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Not specified</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="field">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="classSelect">Class</label>
          <select id="classSelect" required></select>
        </div>
        <div class="field">
          <label for="streamSelect">Stream</label>
          <select id="streamSelect">
            <option value="">None</option>
          </select>
        </div>
      </div>
      <div class="checkbox-field" id="statusRow" style="display:none;">
        <input type="checkbox" id="isActive" />
        <label for="isActive">Active</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/students.js"></script>

</body>
</html>
