<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Results — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Canaan Progressive<br />Schools</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="classes.html">My Classes</a>
      <a href="marks.html">Enter Marks</a>
      <a href="results.html" class="active">Results</a>
      <a href="comments.html">Comments</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Results</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <div id="alertBox"></div>

    <div class="toolbar">
      <select id="assignmentSelect"></select>
      <select id="yearSelect"></select>
      <select id="termSelect"></select>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Student</th><th>AI</th><th>Exam</th><th>Total</th><th>Grade</th></tr>
        </thead>
        <tbody id="resultsBody">
          <tr><td colspan="5" class="page-loading">Choose a class/subject to begin.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/teacher-results.js"></script>

</body>
</html>
