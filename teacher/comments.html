<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Comments — Canaan Progressive Schools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Canaan Progressive<br />Schools</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="classes.html">My Classes</a>
      <a href="marks.html">Enter Marks</a>
      <a href="results.html">Results</a>
      <a href="comments.html" class="active">Comments</a>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1>Report Card Comments</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <div id="alertBox"></div>

    <p style="font-size:0.85rem;color:var(--ink-soft);">
      Only shown here if you're the class teacher for a class. Pick a
      student to open their report card and write your comment.
    </p>

    <div class="toolbar">
      <select id="classTeacherSelect"></select>
      <select id="yearSelect"></select>
      <select id="termSelect"></select>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Student</th><th></th></tr></thead>
        <tbody id="tableBody">
          <tr><td colspan="2" class="page-loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/teacher-comments.js"></script>

</body>
</html>
